<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get iintoo it today</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <img class="background" src="/Images/bg.jpg" alt="***">
            <img class="logo" src="./Images/logo.svg" alt="***">
        </div>
        <div class="right">
            <h1>Get iintoo it today</h1>
            <p>There is no charge or obligation upon registration</p>
            <div class="buttons">
                <button type="button" class="facebook">
                <img class="logofb" src="/Images/facebook.svg" alt="***" width="15px">
                <span>Register with Facebook</span>
                </button>
                <button type="button" class="linkedin">
                <img class="logoli" src="/Images/linkedin.svg" alt="***" width="15px">
                <span>Register with LinkedIn</span>
                </button>
            </div>
            <br><br>
            <section>
                <header>
                    <h3>
                        OR
                    </h3>
                </header>
            </section>     
            <br><br>  
            <div class=inputs>
                <div class="input-box">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email">
                </div>
                <div class="input-box">
                    <label for="phone">Phone</label>
                    <input id="phone" type="tel">
                </div>
            </div>
            <div class="type">
                <h4>What type of investor are you?</h4>
                <p>Select the type of investor you are below.</p>
            </div>
        </div>
    </div>
